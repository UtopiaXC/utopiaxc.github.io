<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Utopia 网盘公告</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            user-select: none;
            font-family: "Consolas", "Courier New", "JetBrains Mono", "SF Mono", "PingFang SC", "Microsoft YaHei", monospace;
        }

        .background-watermark {
            position: absolute;
            font-size: 32vw;
            font-weight: 900;
            line-height: 1;
            color: rgba(255, 255, 255, 0.04);
            letter-spacing: -0.05em;
            pointer-events: none;
            z-index: 1;
            white-space: nowrap;
        }

        .terminal-banner {
            position: relative;
            z-index: 2;
            width: 100%;
            background: rgba(0, 0, 0, 0.28);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding: 48px 0;
        }

        .terminal-content {
            max-width: 960px;
            margin: 0 auto;
            padding: 0 40px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .line {
            display: flex;
            align-items: flex-start;
            font-size: 15px;
            line-height: 1.8;
            letter-spacing: 0.02em;
        }

        .prompt {
            color: #d2a8ff;
            margin-right: 12px;
            font-weight: 700;
            flex-shrink: 0;
        }

        .label {
            color: #e6edf3;
            margin-right: 8px;
            flex-shrink: 0;
        }

        .value {
            color: #d2a8ff;
            word-break: break-word;
        }

        .text-body {
            color: #c9d1d9;
            word-break: break-word;
        }

        .link-group {
            color: #7ee787;
        }

        .link-group a {
            color: #7ee787;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .link-group a:hover {
            color: #aff5b4;
            text-decoration: underline;
        }

        .bracket {
            color: #8b949e;
        }

        .separator {
            color: #8b949e;
            margin: 0 4px;
        }

        @media (max-width: 768px) {
            .terminal-content {
                padding: 0 24px;
                gap: 14px;
            }

            .line {
                font-size: 13.5px;
                line-height: 1.6;
            }

            .background-watermark {
                font-size: 45vw;
            }
        }
    </style>
</head>
<body>
    <div class="background-watermark">410</div>

    <div class="terminal-banner">
        <div class="terminal-content">
            <div class="line">
                <span class="prompt">&gt;</span>
                <span class="label">公告</span>
            </div>
            <div class="line">
                <span class="prompt">&gt;</span>
                <span class="text-body">受到微软E5开发者账户将25T限制为10G的影响，Utopia网盘停运，由于此前并未开放注册，因此停运只影响部分我此前公开的共享链接，共享的文件暂时不再提供下载，抱歉。如果今后找到了大容量存储的代替品，会考虑恢复运营。</span>
            </div>
            <div class="line">
                <span class="prompt">&gt;</span>
                <span class="label">您还可以访问:</span>
                <span class="link-group">
                    <span class="bracket">[</span>
                    <a href="https://utopiaxc.com" target="_blank" rel="noopener noreferrer">UtopiaXC主页</a>
                    <span class="separator">,</span>
                    <a href="https://blog.utopiaxc.com" target="_blank" rel="noopener noreferrer">UtopiaXC博客</a>
                    <span class="separator">,</span>
                    <a href="https://github.com/UtopiaXC" target="_blank" rel="noopener noreferrer">UtopiaXC Github</a>
                    <span class="bracket">] 等。</span>
                </span>
            </div>
        </div>
    </div>

    <script>
        const colorPalettes = [
            ["#2b0938", "#0b0014"],
            ["#1a002c", "#050014"],
            ["#031b33", "#020b14"],
            ["#1c0c24", "#090912"],
            ["#0c1b29", "#1f0d2b"],
            ["#2c1654", "#0d0221"],
            ["#00223e", "#1d0a2d"]
        ];

        const selectedPalette = colorPalettes[Math.floor(Math.random() * colorPalettes.length)];
        const randomAngle = Math.floor(Math.random() * 360);
        document.body.style.background = `linear-gradient(${randomAngle}deg, ${selectedPalette[0]}, ${selectedPalette[1]})`;
    </script>
</body>
</html>
